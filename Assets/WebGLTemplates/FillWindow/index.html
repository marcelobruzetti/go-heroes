<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* The canvas fills the whole window (itch.io iframe or fullscreen): no footer, no fixed size. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; width: 240px; height: 8px; transform: translate(-50%, -50%);
                 border: 2px solid #8f8; padding: 2px; }
      #loading-fill { width: 0%; height: 100%; background: #8f8; }
      #error { position: absolute; left: 0; right: 0; top: 10%; text-align: center; color: #fff; font-family: sans-serif;
               background: #a00; padding: 10px; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-fill"></div></div>
    <div id="error"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: function (msg, type) {
          if (type !== "error") { console.warn(msg); return; }
          var e = document.querySelector("#error");
          e.textContent = msg;
          e.style.display = "block";
        },
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading-fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          config.showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
